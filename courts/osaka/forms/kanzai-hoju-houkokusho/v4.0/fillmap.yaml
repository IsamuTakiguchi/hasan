form: kanzai-hoju-houkokusho
court: osaka
version: "4.0"
doc_type: docx
notes:
  - 管財（自然人）事件固有の補充報告書（0204）。w14:paraId あり。
  - チェック欄は □→☑ の文字置換。日付3スロット（年/月/日）の欄は underline_slots。
  - 「郵便取扱局…郵便局（〒　－　）」の下線は**局名のみ**（〒欄は下線でないため
    機械記入対象外。必要なら局名に続けて手書き）。
  - 15〜25 は個人事業者（現在または申立て前6か月以内）のみ記入。
  - 21・22 の「その理由(　)」、24 の「（場所　）」「（番号　）」は記入欄が
    下線でないため未定義（該当時は questions.md で案内し弁護士が手書き）。
