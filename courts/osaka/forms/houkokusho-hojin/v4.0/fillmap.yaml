form: houkokusho-hojin
court: osaka
version: '4.0'
doc_type: docx
notes:
- 報告書（法人用）（0104）。w14:paraId あり。自然人の報告書（0205）・管財補充報告書（0204）とは別系統の法人独自書式（18項目）。
- 項目18（破産原因が生じた事情・粉飾決算の有無）の本文記入欄は書式内に無い — 「次のとおりである」に続く別紙（時系列の経緯書）を作成して添付する（スキル参照）。
- 代理人・代表者の記名欄の「印」の位置は smoke fill で確認済みの形式で値を渡す。
- 数値・チェックは 0106 資産及び負債一覧表・0107-0114 債権者一覧表・0116-0131 財産目録・0132 リース・0133-0134 訴訟/処分一覧表と整合させる（crosscheck
  対象）。
