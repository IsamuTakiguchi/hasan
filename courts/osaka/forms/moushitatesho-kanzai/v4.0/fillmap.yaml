form: moushitatesho-kanzai
court: osaka
version: "4.0"
doc_type: docx
notes:
  - この docx には w14:paraId が無い。アンカーは context（文言）＋path＋idx の3層で解決する。
  - 申立ての理由の債権額・債権者数・回収見込額は債権者一覧表（0209-0216）・財産目録
    （0218-0234）と必ず一致させる（crosscheck 対象）。
  - 金額の下線runは「＿＿万＿＿」の形で「万」を含んで1runなので、値も
    「２，２１７万０，３６０」のように万を含めた形で渡す。
  - 申立人氏名行のふりがなはルビ（w:ruby のラベル）のため機械記入不可。
    氏名・旧姓のみ記入し、ふりがな欄は提出時に手書きすることを完了報告で案内する。
  - 宛先「大阪地方裁判所（□　支部）御中」— 本庁事件は記入不要。支部事件は☑＋支部名手書き。
fields:
  - id: filing_date
    kind: set_text
    anchor: { paraId: "", idx: 2, path: "", context: 令和　年　月　日 }
    binds: meta.filing_date
    notes: 正式表記（令和７年９月１日）。未定なら空欄のまま
  - id: atesaki_shibu
    kind: checkbox
    anchor: { paraId: "", idx: 3, path: "", context: 大阪地方裁判所（□　支部）御中 }
    options: { 支部: □　支部 }
    binds: meta.court_branch
    notes: 堺支部・岸和田支部の事件のみ「支部」を渡す（☑のみ。支部名は提出時に手書き確認）。
      本庁（第６民事部）は値を渡さない
  - id: dairinin
    kind: underline_fill
    anchor: { paraId: "", idx: 5, path: "", context: 申立代理人弁護士（担当）　印 }
    binds: meta.attorneys[0].name
    notes: 下線runに「　乙　川　一　郎　　印　」の形で入れる（元の「印」を含めて置換）
  - id: soutatsu_basho
    kind: underline_fill
    anchor: { paraId: "", idx: 6, path: "", context: 送達場所(事務所）〒　- }
    binds: meta.attorneys[0].address + office
    notes: 1行目「〒590-0000　大阪府…」（元の〒を含めて置換。郵便番号・丁目番地の数字は半角 — 全角だと行幅を越えて折り返す）。事務所名は2行目 soutatsu_basho2 へ
  - id: soutatsu_basho2
    kind: underline_fill
    anchor: { paraId: "", idx: 7, path: "", context: "" }
    binds: meta.attorneys[0].office
    notes: 送達場所の2行目（下線のみの空欄行）。事務所名を入れる。1行目に収まらない住所の続きがあればその後ろに続けてもよい
  - id: tel_fax
    kind: set_text
    anchor: { paraId: "", idx: 8, path: "", context: TEL（　）　－　FAX（　）　－ }
    binds: meta.attorneys[0].phone/fax
    notes: 「TEL（072）000－0000　　FAX（072）000－0001」形式で全文置換（数字・英字は半角。全角だと行幅を越えて折り返す）
  - id: shimei
    kind: underline_slots
    anchor: { paraId: "", idx: 9, path: "", context: ふりがな申立人氏名　ふりがな旧姓・通称・屋号 }
    slots: ["氏名 例 甲　野　太　郎", "旧姓・通称・屋号（ある場合のみ）"]
    binds: meta.applicant.name / kyusei
    notes: ふりがなはルビのため記入不可（手書き案内）
  - id: nenrei_seinengappi
    kind: set_text
    anchor: { paraId: "", idx: 10, path: "", context: （　歳）（昭和・平成　年　月　日生） }
    binds: meta.applicant.birth
    notes: 「　（３７歳）（昭和６３年３月１０日生）」形式で全文置換（元号は生年から確定）
  - id: honseki
    kind: checkbox
    anchor: { paraId: "", idx: 11, path: "", context: 本籍・国籍　□住民票本籍欄記載のとおり　□国籍 }
    options: { 住民票のとおり: □住民票本籍欄記載のとおり, 国籍: □国籍 }
    binds: meta.applicant.honseki / nationality
  - id: honseki_kokuseki_text
    kind: underline_fill
    anchor: { paraId: "", idx: 11, path: "", context: 本籍・国籍　□住民票本籍欄記載のとおり　□国籍 }
    binds: meta.applicant.nationality
    notes: 外国籍の場合のみ国名を下線に
  - id: jusho
    kind: set_text
    anchor: { paraId: "", idx: 12, path: "", context: （〒　－　）□住民票記載のとおり }
    binds: meta.applicant.address_zip + 住民票どおりか
    notes: 全文置換。住民票どおりなら「（〒５９０－００００）☑住民票記載のとおり」、
      異なる場合は「（〒５９０－００００）□住民票記載のとおり」（下の居所欄に記入）
  - id: kyojusho_check
    kind: checkbox
    anchor: { paraId: "", idx: 13, path: "", context: □　〒　（住民票と異なる場合↓） }
    options: { 有: "□　〒" }
    binds: meta.applicant.kyojusho の有無
    notes: 住民票と現住所が異なる場合のみ☑
  - id: kyojusho_addr
    kind: underline_fill
    anchor: { paraId: "", idx: 13, path: "", context: □　〒　（住民票と異なる場合↓） }
    binds: meta.applicant.kyojusho
    notes: slot 0 の下線に「５９０－００００　大阪府堺市…」。末尾の下線ラベル
      「（住民票と異なる場合↓）」は触らない
    format: { slot: 0 }
  - id: kyojusho_tel_somei
    kind: set_text
    anchor: { paraId: "", idx: 14, path: "", context: （　）　－　□居所についての疎明資料添付 }
    binds: meta.applicant.phone + 疎明資料の有無
    notes: 全文置換。「　（０７２）１２３－４５６７　　☑居所についての疎明資料添付」形式
      （疎明資料を付けない場合は□のまま再現する）
  - id: ippan_saiken
    kind: underline_slots
    anchor:
      paraId: ""
      idx: 24
      path: １　申立人について破産手続を開始する。>１　債務の状況（別紙債権者一覧表記載のと
      context: (1)　一般破産債権総額　万　円（債権者　人）
    slots: ["金額（万込み 例 ２，２１７万０，３６０）", "債権者数"]
    binds: creditors の一般破産債権 合計/件数
    notes: 債権者一覧表（0209）の総括と一致させる
  - id: yusen_saiken
    kind: underline_slots
    anchor:
      paraId: ""
      idx: 26
      path: １　申立人について破産手続を開始する。>１　債務の状況（別紙債権者一覧表記載のと
      context: 万　円（債権者　人）
    slots: ["金額（万込み）", "債権者数"]
    binds: creditors の優先的破産債権・財団債権（公租公課・労働債権等） 合計/件数
    notes: (2) 優先的破産債権及び財団債権総額の行
  - id: kaishu_mikomi
    kind: underline_fill
    anchor:
      paraId: ""
      idx: 28
      path: １　申立人について破産手続を開始する。>２　財産の状況（別紙財産目録記載のとおり
      context: 回収見込額合計　万　円
    binds: assets の回収見込額合計
    notes: 財産目録（0218総括表）の回収見込額合計と一致させる。「万」込みで置換
  - id: hikitsugi_genkin
    kind: underline_fill
    anchor:
      paraId: ""
      idx: 32
      path: １　申立人について破産手続を開始する。>１　破産管財人への引継予定の現金　円
      context: １　破産管財人への引継予定の現金　円
    binds: assets.cash のうち引継予定額
    notes: 「５００，０００」形式（円は印字済み）。必ず記載する欄
  - id: hojin_daihyo
    kind: checkbox
    anchor:
      paraId: ""
      idx: 33
      path: １　申立人について破産手続を開始する。>２　法人の代表者であるか（□当・□否）
      context: ２　法人の代表者であるか（□当・□否）　その法人の破産申立て（□有・□無）
    options: { 当: □当, 否: □否, 法人破産有: □有, 法人破産無: □無 }
    binds: career の法人代表歴 / 関連法人破産の有無
    notes: 複数指定可（例 [当, 法人破産有]）。否なら [否] のみ
  - id: hojin_jiken
    kind: underline_slots
    anchor:
      paraId: ""
      idx: 35
      path: １　申立人について破産手続を開始する。>２　法人の代表者であるか（□当・□否）
      context: 地方裁判所　支部　令和　年(フ)第　号，　係
    slots: ["裁判所名（例 大阪）", "支部名", "年", "号", "係"]
    binds: 関連法人破産事件の係属裁判所・事件番号
  - id: hojin_shinko
    kind: checkbox
    anchor:
      paraId: ""
      idx: 36
      path: １　申立人について破産手続を開始する。>２　法人の代表者であるか（□当・□否）
      context: その事件の進行（□開始決定済・□同時申立・□開始決定未）
    options: { 開始決定済: □開始決定済, 同時申立: □同時申立, 開始決定未: □開始決定未 }
    binds: 関連法人破産事件の進行状況
  - id: hojin_kanzainin
    kind: underline_slots
    anchor:
      paraId: ""
      idx: 37
      path: １　申立人について破産手続を開始する。>２　法人の代表者であるか（□当・□否）
      context: その破産管財人の氏名等（弁護士　，TEL（　）　－　）
    slots: ["管財人弁護士名", "TEL市外局番以降前半", "TEL後半"]
    binds: 関連法人破産事件の管財人
  - id: hojin_yotei
    kind: checkbox
    anchor:
      paraId: ""
      idx: 38
      path: １　申立人について破産手続を開始する。>２　法人の代表者であるか（□当・□否）
      context: 今後の予定（□予定有　令和　年　月ころ・□予定無）
    options: { 予定有: □予定有, 予定無: □予定無 }
    binds: 法人破産申立ての予定
  - id: hojin_yotei_jiki
    kind: underline_slots
    anchor:
      paraId: ""
      idx: 38
      path: １　申立人について破産手続を開始する。>２　法人の代表者であるか（□当・□否）
      context: 今後の予定（□予定有　令和　年　月ころ・□予定無）
    slots: ["年", "月"]
    binds: 法人破産申立ての予定時期
    notes: 予定有のときのみ
  - id: kojin_jigyo
    kind: checkbox
    anchor:
      paraId: ""
      idx: 39
      path: １　申立人について破産手続を開始する。>３　現在個人事業者であるか（□当・□否）
      context: ３　現在個人事業者であるか（□当・□否）
    options: { 当: □当, 否: □否 }
    binds: business の現在事業の有無
  - id: haigusha_moushitate
    kind: checkbox
    anchor:
      paraId: ""
      idx: 40
      path: １　申立人について破産手続を開始する。>４　配偶者の申立て（□有・□無）その係属
      context: ４　配偶者の申立て（□有・□無）その係属する裁判所と事件番号等
    options: { 有: □有, 無: □無 }
    binds: family の配偶者の破産申立て
  - id: haigusha_jiken
    kind: underline_slots
    anchor:
      paraId: ""
      idx: 41
      path: １　申立人について破産手続を開始する。>４　配偶者の申立て（□有・□無）その係属
      context: 地方裁判所　支部　令和　年(フ)第　号，　係
    slots: ["裁判所名", "支部名", "年", "号", "係"]
    binds: 配偶者の破産事件の係属裁判所・事件番号
    notes: idx41（法人欄 idx35 と同文の2つ目）。idx でこちらに解決される
  - id: denshi_nofu_code
    kind: underline_fill
    anchor:
      paraId: ""
      idx: 44
      path: １　申立人について破産手続を開始する。>４　配偶者の申立て（□有・□無）その係属
      context: 電子納付希望の場合　登録コード
    binds: meta.denshi_nofu_code
