notes:
- 疎明資料目録（法人用）（0135）。◇=必須（→◆）・○=該当時（→●）。
- 項目3は「○取締役会議事録　又は○取締役全員の…」の2択 — 前者の○をチェック（後者を選ぶ場合は手書き案内）。
- 通数欄（　通）は下線なし＝手書き。
- 準自己破産の場合は 14〜15 行の○（該当＋予納金財団組入上申書）。
