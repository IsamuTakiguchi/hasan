form: houkokusho
court: osaka
version: '4.0'
doc_type: docx
notes:
- 第３−１の飲食・投資・ギャンブルの明細セル（時期・回数・金額）と第３−２〜４の明細表、第３−５の下線詳細（裁判所名・事件番号）は未定義。必要になったら anchors.txt から追加する。
- checkbox は □→☑ の文字置換。set_text は段落全文置換（先頭runの書式維持）。
