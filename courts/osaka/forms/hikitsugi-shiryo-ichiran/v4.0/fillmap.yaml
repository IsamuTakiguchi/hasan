form: hikitsugi-shiryo-ichiran
court: osaka
version: '4.0'
doc_type: docx
notes:
- w14:paraId 無し。context＋idx で解決。
- ◇区分ヘッダ（→◆）は財産目録に当該財産が存在する場合にチェック（0218-0234 と連動）。
- □個別資料（→☑）は管財人に引き継ぐと**代理人が決めたものだけ**チェック。判断がついていない資料は値を渡さず questions.md（引継予定の確認）へ。
- △（査定書・請求書控え等）は任意資料・チェック欄なし。
- 「５　印鑑（□実印　□銀行印）」の内訳□2つは未定義（必要なら手書き）。
- 下線付きの資料（通帳・車検証・権利証等）は代理人が保管して引継ぎ（書式の注記）。
