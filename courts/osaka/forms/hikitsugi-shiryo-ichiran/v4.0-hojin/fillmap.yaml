notes:
- 管財人引継資料一覧表（法人用）（0136）。w14:paraId 無し。
- ◇区分（→◆）は財産目録（0116-0131）の記載と連動。□（→☑）は代理人の引継判断。
- 「５　印鑑（□代表者印　□銀行印）」の内訳□2つは未定義（必要なら手書き）。
- 在庫商品・機械工具・什器備品の区分ヘッダは無い（一覧表に◇項目が無い）。
