form: jigyou-houkokusho
court: osaka
version: "4.1"
doc_type: docx
notes:
  - w14:paraId 無しの旧型式docx。アンカーは context＋path＋idx で解決。
  - 個人事業者（過去に個人事業を営んでいた場合を含む）の事件で作成する。
    法人代表者のみ（個人事業なし）の場合はこの書式は不要（法人の破綻は報告書第２に記載）。
  - binds は case.yaml の business 区分。
fields:
  - id: houkoku_date
    kind: set_text
    anchor: { paraId: "", idx: 0, path: "", context: 令和　年　月　日 }
    binds: meta.filing_date
  - id: atesaki
    kind: checkbox
    option_anchors:
      第６民事部: { paraId: "", idx: 3, path: "", context: □第６民事部, literal: □第６民事部 }
      支部: { paraId: "", idx: 5, path: "", context: □　支部, literal: □　支部 }
    binds: meta.court_branch
  - id: dairinin
    kind: underline_fill
    anchor: { paraId: "", idx: 7, path: "", context: 申立代理人　印 }
    binds: meta.attorneys[0].name
    notes: 報告書と同じ「弁護士　乙　川　一　郎」形式
  - id: jigyo_umu
