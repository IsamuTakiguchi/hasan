timeline:
  - date: H22.6
    event: 株式会社乙山ストア設立
    detail: 申立人が代表取締役に就任し、堺市内で食品スーパー１店舗を経営した。
  - date: R4後半ころ
    event: 競合出店と物価高騰で売上減少
    detail: 近隣に大型スーパーが出店し客足が減少。仕入価格・光熱費の高騰も重なり、法人の資金繰りが悪化した。
  - date: R6.4
    event: 借入のリスケジュール
    detail: 戊田銀行に対する法人借入の返済条件変更（リスケジュール）を受けたが、売上は回復しなかった。
  - date: R7.1
    event: 法人の支払停止・営業終了
    detail: 資金繰りが尽き、法人は営業を終了。店舗設備は取引先へ事業譲渡し、従業員の再就職先を確保した。
  - date: R7.2
    event: 法人代表者退任・再就職
    detail: 申立人は代表取締役を退任し、株式会社丁原食品に配送員として就職した。
  - date: R7.3
    event: 弁護士に破産申立てを委任
    detail: 連帯保証債務等の支払が不能となり、代理人弁護士に破産申立てを委任し受任通知を発送した。

