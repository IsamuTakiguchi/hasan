  past_saisei_ninka: { exists: false, detail: "" }
  sairyo_jijo: >-
    本件の負債は、申立人が代表を務めた株式会社乙山ストアの事業が競合出店・物価高騰という
    外部要因により破綻し、その連帯保証債務を負担したことによるものであり、浪費や射幸行為に
    よるものではない。第３の１で申告した支出も、通勤に必要な自動車の整備と生活に必要な範囲の
    家電買替えにとどまる。廃業に際しては事業譲渡により取引先・従業員への影響を最小限にとどめ、
    受任後は家計を見直して同時廃止基準内の生活を続けており、破産手続にも誠実に協力する所存である。
  saiken_chosa_hanron: ""

