timeline:
  - date: H22.6
    event: 個人事業「乙山ストア」開業
    detail: 堺市内で食品スーパー１店舗を開業した。
  - date: R4後半ころ
    event: 競合出店と物価高騰で売上減少
    detail: 近隣に大型スーパーが出店し客足が減少。仕入価格・光熱費の高騰も重なり資金繰りが悪化した。
  - date: R6.4
    event: 借入のリスケジュール
    detail: 戊田銀行に対する借入の返済条件変更（リスケジュール）を受けたが、売上は回復しなかった。
  - date: R7.1
    event: 支払停止
    detail: 資金繰りが尽き、仕入代金・リース料の支払を停止した。
  - date: R7.2
    event: 廃業・再就職
    detail: 店舗を閉鎖して廃業し、従業員３名を解雇。株式会社丁原食品に配送員として就職した。
  - date: R7.3
    event: 弁護士に破産申立てを委任
    detail: 代理人弁護士に破産申立てを委任し受任通知を発送した。

