# case.yaml（事件モデル）の JSON Schema（YAML表記, draft 2020-12）
# 検証: python3 scripts/casekit/validate_case.py cases/<事件ID>/case.yaml
#
# 方針:
# - intake は段階的に埋めるため、必須は meta の最小限のみ。
# - 日付は裁判所書式の実態に合わせて文字列（"R7.2" "R4後半ころ" "2025-02-15" いずれも可）。
# - 金額は整数（円）。不明は null または省略（0 と不明を区別する）。
# - 各値の根拠資料は sources に「ドットパス: 出所」で記録する（例 "creditors[2].balance": "債権調査票p3"）。
#   出所のない値は生成時に空欄扱いとなり questions.md に回る。
$schema: "https://json-schema.org/draft/2020-12/schema"
title: hasan case model
type: object
required: [meta]
additionalProperties: false
properties:
  meta:
    type: object
    required: [case_id, applicant]
    additionalProperties: true
    properties:
      case_id: { type: string, description: "cases/ のフォルダ名と一致させる" }
      court: { type: string, description: "courts/ の裁判所ID（例 osaka）" }
      proc_type:
        type: string
        enum: [同時廃止, 管財（自然人）, 管財（法人）]
        description: >-
          手続種別。事件作成時に最初に選択する（intake が確認する）。
          courts/<裁判所>/procs.yaml の書式セット（生成対象・生成順）がこれで決まる
      applicant:
        type: object
        required: [name]
        additionalProperties: true
        properties:
          name: { type: string }
          kana: { type: string }
          birth: { type: string, description: "生年月日（例 S63.3.1）" }
          address: { type: string }
          kyusei: { type: string, description: "旧姓（旧姓で借入れがある場合のみ）" }
          honseki: { type: string, description: "本籍。「住民票のとおり」または本籍地の表示" }
          nationality: { type: string, description: "外国籍の場合の国籍" }
          phone: { type: string, description: "連絡先電話番号" }
      court_branch:
        type: string
        enum: [第６民事部, 堺支部, 岸和田支部]
        description: "申立先（大阪地裁共通様式の宛先チェック）"
      attorneys:
        type: array
        description: "申立代理人。筆頭を先頭に"
        items:
          type: object
          properties:
            name: { type: string }
            office: { type: string }
            address: { type: string, description: "事務所所在地（〒含む。送達場所）" }
            phone: { type: string }
            fax: { type: string }
          required: [name]
      denshi_nofu_code: { type: string, description: "電子納付希望の場合の登録コード" }
      seikatsu_hogo: { type: [boolean, "null"], description: "生活保護受給世帯か" }
      junin_tsuchi_date: { type: string, description: "受任通知発送日" }
      filing_date: { type: string, description: "申立（予定）日。未定なら省略" }
      shiharai_funo:
        type: object
        description: "支払不能になった時期（報告書第２の３）"
        properties:
          date: { type: string, description: "例 R7.1" }
          yakujo_monthly: { type: [integer, "null"], description: "当時の月々の約定返済額（円）。不明は null" }

  career:
    type: array
    description: "職歴。新しい順でなく時系列順。申立ての7年前以降をカバーする範囲"
    items:
      type: object
      additionalProperties: true
      properties:
        period:
          type: object
          properties:
            start: { type: string, description: "短縮元号可（H22.6）" }
            end: { type: string, description: "在職中は '現在'" }
        employment_type:
          type: string
          enum: [勤め, パート等, 自営, 法人代表者, 無職]
        employer: { type: string, description: "就業先。1セル1行に収まる短い表記" }
        position: { type: string, description: "地位・業務内容" }
        monthly_income: { type: [integer, "null"], description: "平均月収（円）" }
        retirement_pay: { type: boolean, description: "退職金有り（資料で確認できた場合のみ true）" }

  family:
    type: object
    additionalProperties: true
    properties:
      marriages:
        type: array
        items:
          type: object
          properties:
            kind: { type: string, enum: [婚姻, 離婚, 死別] }
            date: { type: string }
            note: { type: string }
      members:
        type: array
        description: "配偶者・同居者等"
        items:
          type: object
          properties:
            relation: { type: string }
            name: { type: string }
            age: { type: [integer, "null"] }
            occupation: { type: string }
            income: { type: [integer, "null"] }
      inheritance:
        type: array
        description: "相続の状況"
        items:
          type: object
          properties:
            deceased: { type: string, description: "被相続人と続柄" }
            date: { type: string }
            disposition: { type: string, description: "相続放棄・遺産分割等の処理" }
      housing:
        type: object
        properties:
          kind: { type: string, enum: [賃貸, 持家, 社宅・寮, 家族所有, その他] }
          rent: { type: [integer, "null"], description: "月額家賃（円）" }
          note: { type: string }

  creditors:
    type: array
    description: "債権者。債権者一覧表の並び順（公租公課は末尾等、書式ルールは生成側が処理）"
    items:
      type: object
      required: [name]
      additionalProperties: true
      properties:
        no: { type: integer }
        name: { type: string }
        address: { type: string }
        kind:
          type: string
          description: >-
            債権の種類。管財分類（手形小切手・買掛金・リース・労働債権）は
            債権者一覧表（0209-0216/0107-0114）のシート振り分けに使う。
            貸金・クレジット・立替金・保証・求償は借入金シート、家賃・養育費・その他は
            その他シートに振り分けられる
          enum: [貸金, クレジット, 立替金, 保証, 求償, 公租公課, 家賃, 養育費,
                 手形小切手, 買掛金, リース, 労働債権, その他]
        origin_date: { type: string, description: "借入開始・発生時期" }
        use: { type: string, description: "使途（生活費・事業資金等）" }
        principal: { type: [integer, "null"], description: "当初借入額（円）" }
        balance: { type: [integer, "null"], description: "現在残高（円）" }
        last_payment: { type: string, description: "最終弁済日" }
        guarantor: { type: [boolean, "null"], description: "保証人の有無。不明は null" }
        secured: { type: boolean, description: "別除権（担保）付きか" }
        tax_kind:
          type: string
          description: "kind=公租公課 のときの税目（公租公課用一覧表 B1106 の行に対応）"
          enum: [所得税, 住民税, 固定資産税, 事業税, 消費税, 源泉所得税,
                 法人税, 法人住民税, 国民健康保険料, 年金保険料, 社会保険料,
                 自動車税・軽自動車税, 相続税, その他]
        tax_year: { type: string, description: "kind=公租公課 のときの年度（例 R5年度）" }
        zip: { type: string, description: "郵便番号（管財の債権者一覧表で使用）" }
        tel: { type: string, description: "電話番号" }
        fax: { type: string, description: "FAX番号" }
        tax_office: { type: string, description: "kind=公租公課 のときの所轄（例 堺税務署）" }
        lease:
          type: object
          description: "kind=リース のときのリース物件情報（0213/0235 リース物件一覧表）"
          properties:
            item: { type: string, description: "リース物件（コピー機等）" }
            location: { type: string, description: "物件の所在地" }
            returned: { type: [boolean, "null"], description: "返還済みか" }
            contract_doc: { type: [boolean, "null"], description: "契約書等の有無" }
        labor:
          type: object
          description: "kind=労働債権 のときの内訳（0214 労働債権一覧表）"
          properties:
            period: { type: string, description: "給料未払期間（例 R7.1〜R7.2）" }
            salary: { type: [integer, "null"], description: "①未払給料（円）" }
            retirement_allowance: { type: [integer, "null"], description: "②退職手当（円）" }
            dismissal_notice_allowance: { type: [integer, "null"], description: "③解雇予告手当（円）" }
        tegata:
          type: object
          description: "kind=手形小切手 のときの手形情報（0211）"
          properties:
            number: { type: string, description: "手形小切手番号" }
            endorsement: { type: string, description: "裏書関係" }
            due: { type: string, description: "支払期日" }
        note: { type: string }

  assets:
    type: object
    additionalProperties: true
    description: >-
      財産。管財事件では各項目に recovery（回収見込額・円）と jiyuzaisan
      （自由財産拡張申立の対象なら true）を付けられる（財産目録 0218-0234 の
      回収見込額欄・自由財産拡張申立欄に対応。未指定の recovery は名目額と同額扱い）
    properties:
      cash: { type: [integer, "null"], description: "手持ち現金（円）" }
      deposits:
        type: array
        items:
          type: object
          properties:
            bank: { type: string }
            branch: { type: string }
            account_type: { type: string }
            account_no: { type: string }
            balance: { type: [integer, "null"] }
            as_of: { type: string, description: "残高基準日" }
      insurance:
        type: array
        items:
          type: object
          properties:
            company: { type: string }
            kind: { type: string }
            surrender_value: { type: [integer, "null"], description: "解約返戻金見込（円）" }
      vehicles:
        type: array
        items:
          type: object
          properties:
            name: { type: string, description: "車名・年式" }
            first_registration: { type: string, description: "初度登録年" }
            value: { type: [integer, "null"], description: "査定額（円）" }
            loan_balance: { type: [integer, "null"], description: "所有権留保ローン残（円）" }
      real_estate:
        type: array
        items:
          type: object
          properties:
            address: { type: string }
            kind: { type: string }
            value: { type: [integer, "null"] }
            mortgage: { type: [integer, "null"], description: "被担保債権残（円）" }
      retirement_expectation: { type: [integer, "null"], description: "退職金見込額（円）" }
      tsumitate:
        type: array
        description: "積立金等（社内積立て・財形貯蓄等）"
        items:
          type: object
          properties:
            kind: { type: string }
            start: { type: string, description: "開始時期 例 H30.4" }
            total: { type: [integer, "null"], description: "積立総額（円）" }
      shikikin:
        type: array
        description: "賃借保証金・敷金（申立人名義の賃借物件の差入保証金）"
        items:
          type: object
          properties:
            property: { type: string, description: "賃借物件（自宅・駐車場等）" }
            start: { type: string, description: "契約の始期" }
            deposit: { type: [integer, "null"], description: "差入金額（円）" }
            refund: { type: [integer, "null"], description: "返戻見込（円）" }
            arrears: { type: [integer, "null"], description: "滞納額（円）" }
            restore_cost: { type: [integer, "null"], description: "原状回復費用等の見込額（円）" }
      loans_receivable:
        type: array
        description: "貸付金・求償金等（申立人が有する債権）"
        items:
          type: object
          properties:
            debtor: { type: string }
            amount: { type: [integer, "null"] }
            date: { type: string, description: "貸付時期" }
            recoverable: { type: [boolean, "null"], description: "回収見込み" }
            reason: { type: string, description: "回収できない理由" }
      upcoming:
        type: array
        description: "近日中に取得見込みの財産（交通事故の損害賠償金・財産分与等）"
        items:
          type: object
          properties:
            kind: { type: string }
            counterparty: { type: string }
            amount: { type: [integer, "null"] }
      overpayment:
        type: array
        description: "過払金等の債権"
        items:
          type: object
          properties:
            against: { type: string }
            amount: { type: [integer, "null"] }
      securities:
        type: array
        description: "有価証券（株式・出資金・ゴルフ会員権等。0226/財産目録⑨）"
        items:
          type: object
          properties:
            name: { type: string, description: "財産の内容" }
            quantity: { type: string, description: "数量" }
            cert_no: { type: string, description: "証券番号等" }
            location: { type: string, description: "証券等の所在場所" }
            value: { type: [integer, "null"], description: "簿価等（円）" }
            recovery: { type: [integer, "null"], description: "回収見込額（円）" }
      notes_receivable:
        type: array
        description: "受取手形・小切手（0227/財産目録⑩）"
        items:
          type: object
          properties:
            drawer: { type: string, description: "振出人" }
            zip: { type: string }
            address: { type: string }
            number: { type: string, description: "手形小切手番号" }
            endorser: { type: string, description: "裏書人" }
            due: { type: string, description: "支払期日" }
            face_value: { type: [integer, "null"], description: "額面（円）" }
            recovery: { type: [integer, "null"] }
      accounts_receivable:
        type: array
        description: "売掛金（0228/財産目録⑪。個人事業者）"
        items:
          type: object
          properties:
            debtor: { type: string, description: "債務者名" }
            zip: { type: string }
            address: { type: string }
            amount: { type: [integer, "null"], description: "金額（円）" }
            recovery: { type: [integer, "null"] }
      inventory:
        type: array
        description: "在庫商品（0230/財産目録⑬。個人事業者）"
        items:
          type: object
          properties:
            name: { type: string, description: "品名" }
            quantity: { type: string, description: "個数" }
            location: { type: string, description: "所在場所" }
            value: { type: [integer, "null"], description: "簿価等（円）" }
            recovery: { type: [integer, "null"] }
      machinery:
        type: array
        description: "機械・工具類（0231/財産目録⑭。個人事業者）"
        items:
          type: object
          properties:
            name: { type: string }
            quantity: { type: string }
            location: { type: string }
            value: { type: [integer, "null"] }
            recovery: { type: [integer, "null"] }
      fixtures:
        type: array
        description: "什器備品（0232/財産目録⑮。個人事業者）"
        items:
          type: object
          properties:
            name: { type: string }
            quantity: { type: string }
            location: { type: string }
            value: { type: [integer, "null"] }
            recovery: { type: [integer, "null"] }
      disposed:
        type: array
        description: >-
          処分済財産（0234/財産目録⑰）。過去2年以内に処分した20万円以上の財産
          （流動性の高い現金・預貯金・受取手形・売掛金・在庫は記載不要）。
          menseki.asset_disposal・bank_analysis の資産処分検知と同源の情報
        items:
          type: object
          properties:
            name: { type: string, description: "財産の種類・内容" }
            fictitious: { type: [boolean, "null"], description: "架空計上か（決算書事業者）" }
            disposed: { type: [boolean, "null"], description: "処分したか" }
            date: { type: string, description: "処分日" }
            price: { type: [integer, "null"], description: "処分価格（円）" }
            use: { type: string, description: "処分代金の使途・財産目録非掲載の理由" }
            in_financials: { type: [boolean, "null"], description: "決算書記載か" }
      other:
        type: array
        items:
          type: object
          properties:
            name: { type: string }
            value: { type: [integer, "null"] }
            note: { type: string }

  corporation:
    type: object
    description: >-
      管財（法人）事件用の債務者法人情報（法人用書式 0103 申立書・0104 報告書に対応）。
      法人事件では applicant は代表者ではなく、債務者＝この法人（申立代理人は法人の代理人）
    additionalProperties: true
    properties:
      name: { type: string, description: "商号" }
      kana: { type: string, description: "商号のふりがな" }
      address: { type: string, description: "本店所在地（登記）" }
      head_office_zip: { type: string, description: "本店所在地の郵便番号" }
      registered_as_actual: { type: [boolean, "null"], description: "本店が登記事項証明書記載のとおりか" }
      actual_office: { type: string, description: "登記と異なる実際の主たる事務所（あれば）" }
      representative: { type: string, description: "代表者の資格・氏名（例 代表取締役　甲野太郎）" }
      representative_address: { type: string, description: "代表者の現住所（0104項目16）" }
      representative_tel: { type: string, description: "代表者の連絡先電話番号" }
      representative_mobile: { type: string, description: "代表者の携帯電話番号" }
      established: { type: string, description: "設立年月" }
      business_description: { type: string, description: "申立て前に現実に行っていた事業の内容（0104項目2）" }
      capital: { type: [integer, "null"], description: "資本金（円）" }
      shareholders: { type: string, description: "株主構成の概要" }
      officers:
        type: array
        description: "役員（代表者以外も）"
        items:
          type: object
          properties:
            name: { type: string }
            position: { type: string, description: "役職（取締役・監査役等）" }
            note: { type: string, description: "就任経緯・報酬・法人との貸借等" }
      offices:
        type: array
        description: "営業所・事務所・工場・倉庫・社宅・駐車場等（0104項目3。[0]=本店）"
        items:
          type: object
          properties:
            name: { type: string, description: "名称（本店・○○倉庫等）" }
            address: { type: string }
            post_office: { type: string, description: "取扱郵便局名（局名のみ）" }
            owned: { type: [boolean, "null"], description: "自己所有か（false=賃借）" }
            rent: { type: [integer, "null"], description: "賃料月額（円）" }
            deposit_refund: { type: [integer, "null"], description: "契約上の返戻金（円）" }
            vacated: { type: [boolean, "null"], description: "明渡完了か" }
            vacate_due: { type: string, description: "明渡未了の場合の明渡予定日" }
            restore_cost: { type: [integer, "null"], description: "明渡・原状回復費用見込額（円）" }
            estimate_submitted: { type: [boolean, "null"], description: "見積書の写しを提出したか" }
      employees:
        type: object
        description: "従業員関係（0104項目4）"
        properties:
          count: { type: [integer, "null"], description: "総数" }
          dismissed: { type: [boolean, "null"], description: "解雇したか" }
          dismissal_notice_date: { type: string, description: "解雇通知日（例 R7.2.28）" }
          undismissed_count: { type: [integer, "null"], description: "未解雇の人数" }
          dismissal_due: { type: string, description: "解雇予定日" }
          rishokuhyo_done: { type: [boolean, "null"], description: "離職票を全員に交付済みか" }
          koyohoken_done: { type: [boolean, "null"], description: "雇用保険資格喪失届を提出済みか" }
          shakaihoken_done: { type: [boolean, "null"], description: "社会保険資格喪失届を提出済みか" }
          gensen_done: { type: [boolean, "null"], description: "源泉徴収票を全員に交付済みか" }
          juminzei_done: { type: [boolean, "null"], description: "住民税の異動届を提出済みか" }
          unpaid_wages: { type: [boolean, "null"], description: "未払賃金の有無（労働債権は creditors に）" }
      union:
        type: object
        description: "労働組合（0104項目4(8)）"
        properties:
          exists: { type: [boolean, "null"] }
          name: { type: string }
          office: { type: string, description: "主たる事務所所在地" }
          members: { type: [integer, "null"] }
          representative: { type: string, description: "組合代表者氏名" }
          majority_rep: { type: string, description: "労組が無い場合の従業員過半数代表者の氏名" }
          majority_rep_address: { type: string }
      shiharai_teishi:
        type: object
        description: "支払停止の状況（0104項目5）"
        properties:
          tegata1_date: { type: string, description: "1回目の手形不渡（見込み含む）日" }
          tegata2_date: { type: string, description: "2回目の手形不渡日" }
          heiten_date: { type: string, description: "閉店・廃業の日" }
      licenses:
        type: object
        description: "事業の免許・登録・許可（0104項目6）"
        properties:
          exists: { type: [boolean, "null"] }
          authority: { type: string, description: "所轄行政庁・機関の名称" }
          authority_address: { type: string }
      bank_accounts_closed:
        type: string
        description: "相殺予定以外の預金口座の解約状況（0104項目10）: 終了した／解約予定／未了口座が残る"
        enum: [終了した, 解約予定, 未了口座が残る]
      bank_accounts_close_due: { type: string, description: "解約予定の場合の終了予定日" }
      hasan_gennin:
        type: string
        description: >-
          破産原因が生じた事情（事業不振の経緯・債務増大の理由）と粉飾決算の有無
          （0104項目18）。書式に記入欄が無いため別紙として生成・添付する本文
      funshoku: { type: [boolean, "null"], description: "粉飾決算の有無" }
      fiscal:
        type: array
        description: "直近数期の決算概要"
        items:
          type: object
          properties:
            term: { type: string, description: "期（例 第12期 R6.3期）" }
            sales: { type: [integer, "null"] }
            profit: { type: [integer, "null"] }

  business:
    type: object
    description: "個人事業に関する報告（事業に関する報告書 B1112 に対応）。個人事業者（過去含む）の事件で intake が埋める"
    additionalProperties: true
    properties:
      exists: { type: [boolean, "null"], description: "事業名称（屋号）の有無" }
      name: { type: string, description: "店名・屋号" }
      address: { type: string, description: "事業所所在地" }
      home_shop: { type: boolean, description: "自宅兼店舗か" }
      rental:
        type: object
        description: "事業用賃借物件（営業所・店舗・倉庫）"
        properties:
          exists: { type: [boolean, "null"] }
          arrears: { type: [boolean, "null"], description: "賃料滞納の有無" }
          arrears_months: { type: [integer, "null"] }
          arrears_total: { type: [integer, "null"] }
          vacated: { type: [boolean, "null"], description: "明渡し済みか" }
      description: { type: string, description: "具体的な事業の内容" }
      period:
        type: object
        properties:
          start: { type: string, description: "例 H22.6" }
          end: { type: string, description: "廃業年月。継続中は省略" }
      continuing: { type: [boolean, "null"], description: "現時点での事業継続の有無" }
      annual:
        type: array
        description: "過去3年間の年度別営業状況"
        items:
          type: object
          properties:
            year: { type: string, description: "年度 例 R6" }
            sales: { type: [integer, "null"] }
            expenses: { type: [integer, "null"] }
            employees: { type: [integer, "null"] }
      biz_assets:
        type: object
        description: "事業用資産（設備・什器・車両・在庫等）"
        properties:
          exists: { type: [boolean, "null"] }
          kinds: { type: array, items: { type: string, enum: [事業用設備・機械, 什器備品, 車両, 在庫, その他] } }
          total_value: { type: [integer, "null"] }
      employees:
        type: object
        description: "廃業時（継続中は現在）の従業員"
        properties:
          exists: { type: [boolean, "null"] }
          unpaid_wages: { type: [boolean, "null"] }
          unpaid_detail: { type: string, description: "未払賃金の合計額・未払期間" }
      tax_arrears:
        type: object
        properties:
          exists: { type: [boolean, "null"] }
          total: { type: [integer, "null"] }
      receivables:
        type: object
        description: "売掛金等（未回収債権）"
        properties:
          exists: { type: [boolean, "null"] }
          items:
            type: array
            items:
              type: object
              properties:
                name: { type: string }
                amount: { type: [integer, "null"] }
                date: { type: string }
                recoverable: { type: [boolean, "null"] }
                reason: { type: string }

  household:
    type: array
    description: "家計収支（月次）。家計収支表の対象月（通常申立前2か月）分。古い月から順に"
    items:
      type: object
      required: [month]
      properties:
        month: { type: string, description: "対象月（例 R8.6）" }
        carryover: { type: [integer, "null"], description: "前月からの繰越（円）。資料があるときのみ" }
        income:
          type: object
          description: >-
            収入内訳（円）。キーは家計収支表書式（B1111）の正規費目名:
            給与（申立人分）/給与（配偶者分）/給与（その他）/自営収入（申立人分）/
            自営収入（その他）/年金（申立人分）/年金（その他）/雇用保険/生活保護/
            児童手当/援助/借入れ/その他。対応しない費目はその他行に回る
          additionalProperties: { type: [integer, "null"] }
        expense:
          type: object
          description: >-
            支出内訳（円）。キーは家計収支表書式（B1111）の正規費目名:
            住居費/駐車場代/食費/嗜好品代/外食費/電気代/ガス代/水道代/携帯電話料金/
            その他通信費/日用品代/新聞代/国民健康保険料/保険料/ガソリン代/交通費/
            医療費/被服費/教育費/交際費/娯楽費/債務返済実額（申立人分）/
            債務返済実額（同居者分）。対応しない費目はその他行に回る
          additionalProperties: { type: [integer, "null"] }
        note: { type: string }

  timeline:
    type: array
    description: "破産申立てに至った事情の時系列（報告書第２の５に対応）"
    items:
      type: object
      required: [date, event]
      properties:
        date: { type: string, description: "短縮表記可（H1.11 / R4後半ころ）" }
        event: { type: string, description: "見出し的な一文" }
        detail: { type: string, description: "補足（本文に使う詳しい記述）" }

  menseki:
    type: object
    description: "免責不許可事由に関する報告（報告書第３に対応）。有無が資料で確認できた項目のみ書く"
    additionalProperties: true
    properties:
      rouhi:
        type: object
        description: "浪費・射幸行為（飲食飲酒/投資投機/商品購入/ギャンブル/その他）"
        additionalProperties:
          type: object
          properties:
            exists: { type: boolean }
            period: { type: string }
            frequency: { type: string }
            amount: { type: [integer, "null"], description: "合計額（円）" }
            detail: { type: string }
      asset_disposal:
        type: array
        description: "財産の処分（不利益処分）"
        items:
          type: object
          properties:
            item: { type: string }
            bought: { type: string }
            bought_price: { type: [integer, "null"] }
            sold: { type: string }
            sold_price: { type: [integer, "null"] }
      henpa: { $ref: "#/$defs/umu_setsumei", description: "偏頗行為（破産法252条1項3号）" }
      sajutsu: { $ref: "#/$defs/umu_setsumei", description: "詐術による信用取引（同5号）" }
      past_menseki: { $ref: "#/$defs/umu_setsumei", description: "7年以内の破産免責決定の確定（同10号）" }
      past_saisei_ninka: { $ref: "#/$defs/umu_setsumei", description: "7年以内の個人再生の認可決定の確定（申立書参考事項4・同10号）" }
      sairyo_jijo: { type: string, description: "裁量免責され得る事情（第３の７）の本文" }
      saiken_chosa_hanron: { type: string, description: "債権調査票の意見への反論（第３の８）" }

  lawsuits:
    type: array
    description: >-
      係属中の訴訟等（支払督促・仮差押え・仮処分・競売・保全処分・民事執行を含む）。
      係属中の訴訟等一覧表（0236/0133）と管財補充報告書項目5に対応
    items:
      type: object
      required: [kind]
      properties:
        kind: { type: string, description: "事件の種類（貸金請求訴訟・支払督促・給料差押え等）" }
        counterparty: { type: string, description: "相手方" }
        court: { type: string, description: "係属裁判所" }
        case_no: { type: string, description: "事件番号" }
        note: { type: string, description: "訴訟内容・進行状況等" }

  pre_bankruptcy_disposals:
    type: array
    description: >-
      倒産直前の処分行為等（否認権行使の判断材料。否認権の成否に疑問がある場合も記載）。
      倒産直前の処分行為等一覧表（0237/0134）と管財補充報告書項目6に対応。
      bank_analysis の資産処分・偏頗弁済疑いの確定版
    items:
      type: object
      required: [counterparty]
      properties:
        counterparty: { type: string, description: "相手方" }
        date: { type: string, description: "行為時期" }
        kind: { type: string, description: "行為類型（弁済・資産譲渡・担保設定等）" }
        price: { type: [integer, "null"], description: "処分価格（円）" }
        note: { type: string, description: "参考となるべき事項" }

  bank_analysis:
    type: array
    description: "入出金分析の所見。hasan-nyushukkin-bunseki が記入"
    items:
      type: object
      required: [date, amount, flag]
      properties:
        date: { type: string }
        account: { type: string, description: "口座（銀行・支店）" }
        amount: { type: integer, description: "円。出金は正の値で direction で区別" }
        direction: { type: string, enum: [入金, 出金] }
        flag:
          type: string
          enum: [大口出金, 大口入金, 偏頗弁済疑い, 受任通知後弁済, 使途不明, ギャンブル疑い, 現金化疑い, 資産処分, その他要確認]
        note: { type: string }
        resolved: { type: boolean, description: "弁護士確認で説明がついたら true" }

  sources:
    type: object
    description: "出所管理: 値のドットパス → 根拠資料。例 'creditors[2].balance': '債権調査票p3'"
    additionalProperties: { type: string }

  open_questions:
    type: array
    description: "未充足・矛盾項目。questions.md に整形出力される"
    items:
      type: object
      required: [question]
      properties:
        field: { type: string, description: "関係するドットパス" }
        question: { type: string }
        reason: { type: string, description: "不足・矛盾の理由" }
        affects: { type: array, items: { type: string }, description: "影響する書式ID" }
        answered: { type: string, description: "回答が得られたら記入し、値を反映後は消してよい" }

$defs:
  umu_setsumei:
    type: object
    properties:
      exists: { type: [boolean, "null"], description: "有無。未確認は null" }
      detail: { type: string }
